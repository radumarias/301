name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [production, staging]
        default: production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check ui/app.js
      - run: node --check tests/e2e.mjs

  e2e:
    # Runs the real Worker under `wrangler dev` (local D1, KV and R2) and drives it over HTTP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo install -q worker-build@^0.8
      - name: Local config
        run: |
          sed -i '/^# >>> ae/,/^# <<< ae/d' wrangler.toml
          echo 'DEV_AUTH_EMAIL=e2e@localhost' > .dev.vars
          npx wrangler d1 migrations apply DB --local
      - name: Start the Worker
        run: |
          npx wrangler dev --test-scheduled --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8787/robots.txt >/dev/null && break; sleep 2; done
      - run: node tests/e2e.mjs http://127.0.0.1:8787
      - if: failure()
        run: tail -n 200 wrangler.log

  deploy:
    needs: [test, e2e]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANALYTICS_API_TOKEN: ${{ secrets.ANALYTICS_API_TOKEN }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      ADMIN_SERVICE_TOKENS: ${{ vars.ADMIN_SERVICE_TOKENS }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      # Staging is a full second copy with its own Worker, KV, D1, R2 and Access app,
      # served on xorio-301-staging.<subdomain>.workers.dev.
      DOMAIN: ${{ inputs.target == 'staging' && vars.STAGING_DOMAIN || vars.DOMAIN }}
      WORKER_NAME: ${{ inputs.target == 'staging' && 'xorio-301-staging' || 'xorio-301' }}
      KV_TITLE: ${{ inputs.target == 'staging' && 'xorio-301-staging-links' || 'xorio-301-links' }}
      D1_NAME: ${{ inputs.target == 'staging' && 'xorio-301-staging' || 'xorio-301' }}
      R2_BUCKET: ${{ inputs.target == 'staging' && 'xorio-301-staging-backups' || 'xorio-301-backups' }}
      AE_DATASET: ${{ inputs.target == 'staging' && 'xorio_301_staging_clicks' || 'xorio_301_clicks' }}
      APP_NAME: ${{ inputs.target == 'staging' && '301 admin (staging)' || '301 admin' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provision KV, D1 and Cloudflare Access
        run: ./scripts/provision.sh
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Analytics Engine token
        if: env.ANALYTICS_API_TOKEN != ''
        run: printf '%s' "$ANALYTICS_API_TOKEN" | npx wrangler secret put ANALYTICS_API_TOKEN
      - name: Smoke test
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' https://$DOMAIN/robots.txt)
          echo "robots.txt -> $code"; test "$code" = 200
          code=$(curl -s -o /dev/null -w '%{http_code}' https://$DOMAIN/api/me)
          echo "/api/me without login -> $code (expect 302/401/403 from Access)"; test "$code" != 200

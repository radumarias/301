name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check ui/app.js

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      ADMIN_SERVICE_TOKENS: ${{ vars.ADMIN_SERVICE_TOKENS }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      DOMAIN: ${{ vars.DOMAIN }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provision KV, D1 and Cloudflare Access
        run: ./scripts/provision.sh
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Set Worker secrets
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
        run: |
          # Only the secrets that are set in GitHub are uploaded; the others are left as they are.
          jq -n 'env | {GOOGLE_CLIENT_SECRET, TURNSTILE_SECRET, SAFE_BROWSING_KEY} | with_entries(select(.value != null and .value != ""))' > "$RUNNER_TEMP/secrets.json"
          if [ "$(jq 'length' "$RUNNER_TEMP/secrets.json")" -gt 0 ]; then
            npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          fi
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' https://$DOMAIN/robots.txt)
          echo "robots.txt -> $code"; test "$code" = 200
          code=$(curl -s -o /dev/null -w '%{http_code}' https://$DOMAIN/api/me)
          echo "/api/me without login -> $code (expect 401 or a 302/403 from Access)"; test "$code" != 200

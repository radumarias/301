[package]
name = "xorio-301"
version = "0.1.0"
edition = "2021"
description = "301.xorio.rs - a personal URL shortener on Cloudflare Workers"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey", "WorkerGlobalScope"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
url = "2"
getrandom = { version = "0.2", features = ["js"] }
percent-encoding = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

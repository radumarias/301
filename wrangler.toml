name = "xorio-301"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
# Served on <name>.<account subdomain>.workers.dev. To move to a custom domain, set the
# DOMAIN repo variable (e.g. 301.xorio.rs): scripts/provision.sh then sets
# workers_dev = false and adds the custom_domain route in CI.
workers_dev = true
# Version preview URLs would expose the Worker on extra hosts outside the Access app.
preview_urls = false

[build]
command = "cargo install -q --locked worker-build@0.8.7 && worker-build --release"
watch_dir = ["src", "ui", "migrations"]

[observability]
enabled = true

# ids are filled in by scripts/provision.sh
[[kv_namespaces]]
binding = "LINKS"
id = "REPLACE_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "xorio-301"
database_id = "REPLACE_D1_ID"
migrations_dir = "migrations"

# Per-IP limit on the public redirect path (/_/ and /api/ are not limited). Over the
# limit a visitor gets a 429 and no KV read or D1 write happens. period must be 10 or 60
# seconds; namespace_id is any positive integer unique to this account. Counters are
# kept per Cloudflare location, so the limit is approximate. Raise or lower `limit` to tune.
[[ratelimits]]
name = "REDIRECT_LIMITER"
namespace_id = "3011"

  [ratelimits.simple]
  limit = 100
  period = 60

# Cron jobs (must match HOURLY / NIGHTLY in src/lib.rs). Every 10 minutes: roll
# Analytics Engine clicks into link totals and check a batch of destinations for broken
# links. Hourly: click-retention purge (Settings -> Keep click details for; up to 100k
# expired rows per run). Nightly: R2 backup and backup pruning.
[triggers]
crons = ["*/10 * * * *", "23 * * * *", "17 3 * * *"]

# >>> ae (scripts/provision.sh removes this block unless ANALYTICS_API_TOKEN is set)
# Click analytics on Analytics Engine; stats are read back through the SQL API with the
# ANALYTICS_API_TOKEN secret. Without it clicks keep going to D1.
[[analytics_engine_datasets]]
binding = "CLICKS_AE"
dataset = "xorio_301_clicks"
# <<< ae

# >>> r2 (scripts/provision.sh removes this block when R2 is not enabled on the account)
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "xorio-301-backups"
# <<< r2

[vars]
# Set by scripts/provision.sh from the Cloudflare Access application.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Comma-separated emails allowed into the admin.
ADMIN_EMAILS = ""
# Comma-separated Access service token client IDs (common_name) allowed into the API.
ADMIN_SERVICE_TOKENS = ""
# Optional contact (email or URL) shown on the public /privacy page.
PRIVACY_CONTACT = ""
# Account that owns the Analytics Engine dataset (set by scripts/provision.sh).
CLOUDFLARE_ACCOUNT_ID = ""
# Must match the dataset above.
AE_DATASET = "xorio_301_clicks"

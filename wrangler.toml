name = "xorio-301"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
# Served on <name>.<account subdomain>.workers.dev. To move to a custom domain, set
# workers_dev = false, add routes = [{ pattern = "301.xorio.rs", custom_domain = true }]
# and the DOMAIN repo variable.
workers_dev = true
# Version preview URLs would expose the Worker on extra hosts outside the Access app.
preview_urls = false

[build]
command = "cargo install -q --locked worker-build@0.8.7 && worker-build --release"
watch_dir = ["src", "ui", "migrations"]

# Hourly click-retention purge (Settings -> Keep click details for). Each run deletes
# up to 100k expired rows, so a backlog drains within a few hours.
[triggers]
crons = ["23 * * * *"]

[observability]
enabled = true

# ids are filled in by scripts/provision.sh
[[kv_namespaces]]
binding = "LINKS"
id = "REPLACE_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "xorio-301"
database_id = "REPLACE_D1_ID"
migrations_dir = "migrations"

# Per-IP limit on the public redirect path (/_/ and /api/ are not limited). Over the
# limit a visitor gets a 429 and no KV read or D1 write happens. period must be 10 or 60
# seconds; namespace_id is any positive integer unique to this account. Counters are
# kept per Cloudflare location, so the limit is approximate. Raise or lower `limit` to tune.
[[ratelimits]]
name = "REDIRECT_LIMITER"
namespace_id = "3011"

  [ratelimits.simple]
  limit = 100
  period = 60

[vars]
# Set by scripts/provision.sh from the Cloudflare Access application (empty when
# Google sign-in is used instead).
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Comma-separated emails allowed into the admin.
ADMIN_EMAILS = ""
# Comma-separated Access service token client IDs (common_name) allowed into the API.
ADMIN_SERVICE_TOKENS = ""
# Google sign-in (OAuth client ID; GOOGLE_CLIENT_SECRET is a Worker secret). When set,
# scripts/provision.sh removes the Cloudflare Access app so anyone can sign in.
GOOGLE_CLIENT_ID = ""
# Cloudflare Turnstile site key (TURNSTILE_SECRET is a Worker secret). Anonymous links
# stay off until both are set. SAFE_BROWSING_KEY (optional secret) enables URL checks.
TURNSTILE_SITE_KEY = ""
# Optional contact (email or URL) shown on the public /privacy page.
PRIVACY_CONTACT = ""

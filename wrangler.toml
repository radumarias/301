name = "xorio-301"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
# Served on <name>.<account subdomain>.workers.dev. To move to a custom domain, set
# workers_dev = false, add routes = [{ pattern = "301.xorio.rs", custom_domain = true }]
# and the DOMAIN repo variable.
workers_dev = true

[build]
command = "cargo install -q worker-build@^0.8 && worker-build --release"
watch_dir = ["src", "ui", "migrations"]

[observability]
enabled = true

# ids are filled in by scripts/provision.sh
[[kv_namespaces]]
binding = "LINKS"
id = "REPLACE_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "xorio-301"
database_id = "REPLACE_D1_ID"
migrations_dir = "migrations"

[vars]
# Set by scripts/provision.sh from the Cloudflare Access application (empty when
# Google sign-in is used instead).
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Comma-separated emails allowed into the admin.
ADMIN_EMAILS = ""
# Comma-separated Access service token client IDs (common_name) allowed into the API.
ADMIN_SERVICE_TOKENS = ""
# Google sign-in (OAuth client ID; GOOGLE_CLIENT_SECRET is a Worker secret). When set,
# scripts/provision.sh removes the Cloudflare Access app so anyone can sign in.
GOOGLE_CLIENT_ID = ""
# Cloudflare Turnstile site key (TURNSTILE_SECRET is a Worker secret). Anonymous links
# stay off until both are set. SAFE_BROWSING_KEY (optional secret) enables URL checks.
TURNSTILE_SITE_KEY = ""
